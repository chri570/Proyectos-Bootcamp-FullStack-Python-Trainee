{% extends "base.html" %}

{% block title %}Ingresar a Alke Wallet{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-2">Iniciar sesión</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">Usuario/contraseña incorrectos</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {#Al no especificar action, la redireccion se hace de acuerdo a LOGIN_REDIRECT_URL#}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control" value="{{ form.username.value | default_if_none:'' }}" autocomplete="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
                    </div>

                    <button class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
