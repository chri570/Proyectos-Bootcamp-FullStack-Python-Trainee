<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Wallet - Login</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <style>
            body
            {
                padding: 20px;
            }

            .container
            {
                max-width: 400px;
                margin: 0 auto;
                background-color:rgb(248, 243, 233);
                opacity: 0;
            }
        </style>
    </head>
    <body>
        
        <!--Login inicio-->
        <div class="container border">
            <h2 class="text-center bg-primary">Iniciar sesión</h2>
            
            <!--Ingreso credenciales-->
            <form id="form_login" action="menu.html" method="post">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingresar email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingresar contraseña">
                </div>
                <div class="text-center mb-2">
                    <button class="btn btn-primary" id="btn_ingresar">Ingresar</button>
                </div>
            
            </form>
            
            <!--Alerta-->
            <div id="estado">
            </div>
        </div>
        
        <script>    
            $(document).ready(function()
            {
                $(".container").animate({ opacity: 1 }, 800);
                
                //Credenciales para acceder a la sesion
                let user_email = "admin@admin.cl";
                let user_pass = "123456";
                
                //Manejo formulario inicio sesion
                $("#form_login").submit(function(event)
                {
                    event.preventDefault();
                    //Alerta validacion exitosa
                    if(user_email === $("#email").val() && user_pass === $("#password").val())
                    {
                        $("#estado").attr("class", "alert alert-success");
                        $("#estado").text("Iniciando sesión. Espere...");
                        setTimeout(
                        function()
                        {
                            window.location.replace("menu.html");
                        },
                        2000);
                    }
                    //Alerta datos incompletos
                    else if ($("#email").val() === "" || $("#password").val() === "")
                    {
                        $("#estado").attr("class", "alert alert-warning");
                        $("#estado").text("Debe completar todos los campos.");
                    }
                    //Alerta validacion incorrecta
                    else
                    {
                        $("#estado").attr("class", "alert alert-danger");
                        $("#estado").text("Credenciales incorrectas.");
                    }
                });
            });

        </script>

    </body>
</html>
