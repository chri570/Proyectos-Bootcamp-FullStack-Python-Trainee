{% extends "base.html" %}

{% block title %}Inicio Sesion{% endblock %}

{% block content %}
    <div class="container inicio_sesion pb-2">
        <h1 class="text-center mb-4">Iniciar sesión</h1>

        {% if form.errors %}
            <div class="alert alert-danger">Credenciales incorrectas.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            </div>
        </form>

        <div class="d-flex justify-content-end align-items-center gap-2 mt-4">
            <p class="mb-0">¿No tienes cuenta?</p>
            <a href="{% url 'registro' %}" class="btn btn-secondary">Regístrate</a>
        </div>
    </div>
{% endblock %}
