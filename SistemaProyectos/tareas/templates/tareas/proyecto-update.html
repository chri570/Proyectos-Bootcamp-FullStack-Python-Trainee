{% extends "base.html" %}

{% block title %}Actualizar/Editar proyecto{% endblock %}

{% block content %}
    <h1>Actualizar proyecto</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Actualizar</button>
        <a href="{% url 'proyecto_list' %}">Cancelar</a>
    </form>

{% endblock %}
